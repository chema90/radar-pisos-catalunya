name: Refresh official sources
on:
  workflow_dispatch:
  schedule:
    - cron: '20 5 1 * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python scripts/build_municipality_catalog.py
      - run: python scripts/parse_interest_zones.py
      - run: python scripts/validate_data.py
      - run: git diff -- public/data data/raw
